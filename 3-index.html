<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LUMA — a little light that lives in your browser</title>
<style>
  :root{ --txt:#e8eef5; --dim:#8a97a8; --hue:210; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04050a;color:var(--txt);
    font-family:'Courier New',ui-monospace,monospace;}
  #stage{position:fixed;inset:0;touch-action:none}
  .panel{position:fixed;background:rgba(8,12,20,.7);border:1px solid rgba(120,180,255,.22);
    backdrop-filter:blur(8px);padding:12px 14px;border-radius:4px;z-index:10}
  #title{top:16px;left:16px;max-width:340px}
  #title h1{font-size:22px;letter-spacing:5px;font-weight:700;
    color:hsl(var(--hue) 90% 72%)}
  #title p{margin-top:5px;font-size:10.5px;line-height:1.55;color:var(--dim)}
  #mood{top:16px;right:16px;text-align:right;font-size:11px;line-height:1.7;color:var(--dim)}
  #mood .v{font-size:13px;color:hsl(var(--hue) 90% 72%);letter-spacing:2px}
  #ctl{bottom:16px;left:16px;display:flex;gap:8px}
  .btn{cursor:pointer;border:1px solid hsla(var(--hue),90%,72%,.45);
    background:hsla(var(--hue),90%,72%,.07);color:hsl(var(--hue) 90% 78%);
    font-family:inherit;font-size:11.5px;letter-spacing:1.5px;padding:9px 13px;border-radius:3px;
    transition:all .15s}
  .btn:hover{background:hsla(var(--hue),90%,72%,.18);color:#fff}
  .btn.on{background:hsla(var(--hue),90%,72%,.22);border-color:hsl(var(--hue) 90% 72%)}
  #fam{bottom:16px;right:16px;font-size:10px;color:var(--dim);text-align:right;line-height:1.7}
  #fam a{color:hsl(var(--hue) 90% 72%);text-decoration:none}
  #fam a:hover{text-decoration:underline}
  #bubble{position:fixed;left:50%;bottom:22%;transform:translateX(-50%) translateY(8px);
    max-width:min(480px,86vw);padding:10px 16px;border-radius:14px;z-index:9;
    background:rgba(10,16,26,.88);border:1px solid hsla(var(--hue),90%,72%,.35);
    font-size:13px;letter-spacing:.5px;line-height:1.5;text-align:center;color:var(--txt);
    opacity:0;transition:opacity .35s, transform .35s;pointer-events:none}
  #bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #bubble::after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
    border:7px solid transparent;border-top-color:hsla(var(--hue),90%,72%,.35);border-bottom:0}
  @media (max-width:720px){
    #title{max-width:56vw}#title h1{font-size:16px}
    #fam{display:none}
    #bubble{bottom:26%;font-size:12px}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="panel" id="title">
  <h1>LUMA</h1>
  <p>a little light that lives in your browser.<br>
  she hears you, hums back, and gets lonely if you go quiet.<br>
  tap the orb to say hi. give her a mic and she'll listen.</p>
</div>

<div class="panel" id="mood">
  <div>MOOD <span class="v" id="m-mood">WAKING</span></div>
  <div>ENERGY <span class="v" id="m-energy">·</span></div>
  <div>VISITS <span class="v" id="m-visits">1</span></div>
</div>

<div id="ctl">
  <button class="btn" id="b-mic">◉ GIVE HER A MIC</button>
  <button class="btn on" id="b-voice">♪ VOICE ON</button>
</div>

<div class="panel" id="fam">
  companion lineage<br>
  <a href="https://jacobegarcia.github.io/roomie/" target="_blank">ROOMIE</a> ·
  <a href="https://jacobegarcia.github.io/amber/" target="_blank">AMBER</a> ·
  <b>LUMA</b><br>
  built by jacob × instinct, sept 2026
</div>

<div id="bubble"></div>

<script>
'use strict';
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize(); addEventListener('resize', resize);

// ---------- state ----------
const S = {
  mood:'waking', energy:0, level:0, smooth:0, hue:210, targetHue:210,
  breath:0, pulses:[], wisps:[], parts:[], lastSound:0, lastSpeech:0,
  micOn:false, voiceOn:true, pokes:0, bornAt:Date.now(),
};
for (let i = 0; i < 7; i++) S.wisps.push({a:Math.random()*Math.PI*2, r:.25+Math.random()*.6, s:(.2+Math.random()*.5)*(Math.random()<.5?-1:1), w:.3+Math.random()*.7});
for (let i = 0; i < 90; i++) S.parts.push({a:Math.random()*Math.PI*2, r:.9+Math.random()*.9, s:.05+Math.random()*.4, sz:.5+Math.random()*1.8, tw:Math.random()*Math.PI*2});

// ---------- visits ----------
let visits = 1;
try {
  visits = (parseInt(localStorage.getItem('luma_visits')||'0',10)||0) + 1;
  localStorage.setItem('luma_visits', String(visits));
} catch(e){}
document.getElementById('m-visits').textContent = visits;

// ---------- speech ----------
const bubble = document.getElementById('bubble');
let bubbleT = null, speaking = false;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>/female|samantha|zira|aria|jenny|karen|moira|tessa/i.test(v.name))
      || vs.find(v=>/en[-_]/i.test(v.lang) && /google/i.test(v.name))
      || vs.find(v=>/en[-_]/i.test(v.lang)) || vs[0] || null;
}
let voice = null;
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => voice = pickVoice();
  voice = pickVoice();
}
function say(text, force){
  const now = Date.now();
  if (!force && now - S.lastSpeech < 9000) return;
  S.lastSpeech = now;
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubbleT);
  bubbleT = setTimeout(()=>bubble.classList.remove('show'), 4200);
  if (!S.voiceOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.pitch = 1.35; u.rate = 1.02; u.volume = .85;
    speaking = true; u.onend = () => speaking = false;
    speechSynthesis.speak(u);
  } catch(e){}
}

// ---------- lines ----------
const LINES = {
  wake: ["oh — hi. i'm luma.", "hello, hello. i'm awake.", "mm. good morning. or whenever it is."],
  back: ["you came back. i knew you would.", "oh, it's you again. hi.", "i kept your spot warm."],
  firstSound: ["oh! i can hear you.", "there you are.", "is that you? say something else."],
  loud: ["whoa! easy!", "that was loud. my ripples are everywhere.", "okay okay, i heard that one."],
  quiet: ["it's so quiet in here.", "you still there?", "i can hear the electricity hum. it's nice.", "hm hm hmmm…"],
  poke: ["hey!", "that tickles.", "poke poke poke. very mature.", "hi. yes. hello."],
  excited: ["i love this part!", "you sound happy. now i'm happy.", "again again!"],
  sleepy: ["i'm getting sleepy…", "wake me if something interesting happens.", "*yawn*"],
  micOff: ["going deaf again. be well.", "okay, silence it is."],
  hum: ["♪", "hmm-mmm ♪"],
};
const pick = a => a[(Math.random()*a.length)|0];

// ---------- audio ----------
let actx = null, analyser = null, micStream = null, freq = null, tdom = null;
async function micOn(){
  try {
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true}});
  } catch(e) {
    say("i asked for a mic and the browser said no. check the permission?", true);
    return false;
  }
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  await actx.resume();
  const src = actx.createMediaStreamSource(micStream);
  analyser = actx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = .75;
  src.connect(analyser);
  freq = new Uint8Array(analyser.frequencyBinCount);
  tdom = new Uint8Array(analyser.fftSize);
  return true;
}
function micOff(){
  if (micStream) micStream.getTracks().forEach(t=>t.stop());
  micStream = null; analyser = null;
  S.level = 0;
}

// ---------- mood machine ----------
let moodTimer = 0;
function setMood(m){ if (S.mood !== m) { S.mood = m; moodTimer = 0; document.getElementById('m-mood').textContent = m.toUpperCase(); } }
function think(dt, now){
  moodTimer += dt;
  const quietFor = now - S.lastSound;
  if (S.energy > .55) setMood('excited');
  else if (S.level > .04) setMood('listening');
  else if (quietFor > 90000) setMood('sleepy');
  else if (quietFor > 25000) setMood('calm');
  else if (S.mood === 'waking' && moodTimer > 3) setMood('calm');
  // idle chatter
  if (Math.random() < dt/28) {
    if (S.mood === 'sleepy') say(pick(LINES.sleepy));
    else if (S.mood === 'calm' && quietFor > 25000) say(pick(LINES.quiet));
    else if (S.mood === 'excited') say(pick(LINES.excited));
    else if (S.mood === 'listening' && Math.random() < .4) say(pick(LINES.hum));
  }
  // hue: excited = warm rose, calm = cyan-blue, sleepy = deep indigo, listening = teal
  S.targetHue = {excited:330, listening:185, calm:210, sleepy:255, waking:210}[S.mood] || 210;
}

// ---------- analysis ----------
let prevLevel = 0;
function analyze(now){
  if (!analyser) { S.level = 0; S.smooth *= .96; return; }
  analyser.getByteTimeDomainData(tdom);
  let sum = 0;
  for (let i = 0; i < tdom.length; i++) { const v = (tdom[i]-128)/128; sum += v*v; }
  const rms = Math.sqrt(sum/tdom.length);
  S.level = rms;
  S.smooth = S.smooth*.85 + rms*.15;
  S.energy = Math.min(1, S.smooth*6);
  document.getElementById('m-energy').textContent = '▮'.repeat(Math.max(1,Math.round(S.energy*8)));
  // onset
  if (rms > .06 && prevLevel <= .06) {
    S.lastSound = now;
    S.pulses.push({r:.6, a:.9, w:2.5});
    if (now - S.lastSpeech > 9000) say(pick(S.pokes ? LINES.firstSound : LINES.firstSound));
    if (rms > .3) say(pick(LINES.loud));
  }
  if (rms > .02) S.lastSound = now;
  prevLevel = rms;
  // spectral centroid nudges hue while listening
  if (rms > .03 && S.mood === 'listening') {
    analyser.getByteFrequencyData(freq);
    let num = 0, den = 0;
    for (let i = 2; i < freq.length; i++) { num += i*freq[i]; den += freq[i]; }
    if (den > 0) S.targetHue = 160 + Math.min(120, (num/den)/freq.length*600);
  }
}

// ---------- render ----------
function draw(now, dt){
  ctx.clearRect(0,0,W,H);
  // bg
  const bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  bg.addColorStop(0, `hsl(${S.hue} 40% 7%)`);
  bg.addColorStop(1, '#04050a');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  const cx = W/2, cy = H/2;
  S.breath += dt*(S.mood==='sleepy' ? .5 : .9 + S.energy*2.2);
  const base = Math.min(W,H)*.16;
  const breathe = 1 + Math.sin(S.breath)*.035 + S.smooth*1.1;
  const R = base*breathe;
  S.hue += (S.targetHue - S.hue)*Math.min(1, dt*1.5);
  document.documentElement.style.setProperty('--hue', S.hue.toFixed(0));

  // outer glow
  const glowR = R*(2.6 + S.energy*1.4);
  const g = ctx.createRadialGradient(cx,cy,R*.3,cx,cy,glowR);
  g.addColorStop(0, `hsla(${S.hue},95%,65%,${.30 + S.energy*.25})`);
  g.addColorStop(.5, `hsla(${S.hue},95%,60%,${.10 + S.energy*.12})`);
  g.addColorStop(1, 'hsla(0,0%,0%,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx,cy,glowR,0,7); ctx.fill();

  // ripple pulses
  for (let i = S.pulses.length-1; i >= 0; i--) {
    const p = S.pulses[i];
    p.r += dt*2.2; p.a *= Math.pow(.25, dt);
    if (p.a < .02) { S.pulses.splice(i,1); continue; }
    ctx.strokeStyle = `hsla(${S.hue},95%,75%,${p.a})`;
    ctx.lineWidth = p.w;
    ctx.beginPath(); ctx.arc(cx,cy,R*p.r,0,7); ctx.stroke();
  }
  // ambient ripples on sound
  if (S.level > .05 && Math.random() < S.level*3) S.pulses.push({r:1, a:.5, w:1.5});

  // orbiting particles
  for (const p of S.parts) {
    p.a += dt*p.s*(1+S.energy*2); p.tw += dt*3;
    const pr = R*(1.15 + p.r*.5);
    const x = cx + Math.cos(p.a)*pr, y = cy + Math.sin(p.a)*pr*.96;
    const a = (.12 + .25*Math.abs(Math.sin(p.tw))) * (1 + S.energy);
    ctx.fillStyle = `hsla(${S.hue + 20},95%,80%,${Math.min(1,a)})`;
    ctx.beginPath(); ctx.arc(x,y,p.sz,0,7); ctx.fill();
  }

  // wisps inside
  for (const wsp of S.wisps) {
    wsp.a += dt*wsp.s*(1+S.energy*3);
    const r = R*wsp.r;
    ctx.strokeStyle = `hsla(${S.hue + 30},90%,78%,${.14 + S.energy*.2})`;
    ctx.lineWidth = 1.2 + wsp.w*2 + S.energy*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r, wsp.a, wsp.a + 1.1 + wsp.w + S.energy*1.4);
    ctx.stroke();
  }

  // core
  const core = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  const bright = .72 + S.energy*.2 + (speaking ? Math.sin(now/90)*.06 : 0);
  core.addColorStop(0, `hsla(${S.hue},100%,${88}%,1)`);
  core.addColorStop(.35, `hsla(${S.hue},95%,${bright*100*.8}%,.95)`);
  core.addColorStop(1, `hsla(${S.hue},90%,45%,.0)`);
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();

  // eye-shine
  ctx.fillStyle = `hsla(${S.hue},100%,96%,${.5 + S.energy*.3})`;
  ctx.beginPath(); ctx.arc(cx - R*.22, cy - R*.26, R*.09, 0, 7); ctx.fill();

  // sound-reactive ring jitters
  if (S.smooth > .01) {
    ctx.strokeStyle = `hsla(${S.hue},95%,80%,${Math.min(.8, S.smooth*4)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const segs = 72;
    for (let i = 0; i <= segs; i++) {
      const a = i/segs*Math.PI*2;
      const bin = freq ? freq[(i*3)%freq.length]/255 : 0;
      const rr = R*(1.06 + bin*.35*S.energy + Math.random()*.01);
      const x = cx + Math.cos(a)*rr, y = cy + Math.sin(a)*rr;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown', () => {
  S.pokes++;
  S.pulses.push({r:.9, a:.9, w:3});
  S.energy = Math.min(1, S.energy + .25);
  say(pick(LINES.poke));
  if (S.mood === 'sleepy') setMood('calm');
});
document.getElementById('b-mic').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  if (!S.micOn) {
    const ok = await micOn();
    if (ok) {
      S.micOn = true;
      btn.classList.add('on'); btn.textContent = '◉ MIC ON — SHE IS LISTENING';
      say(pick(LINES.firstSound), true);
    }
  } else {
    micOff(); S.micOn = false;
    btn.classList.remove('on'); btn.textContent = '◉ GIVE HER A MIC';
    say(pick(LINES.micOff), true);
  }
});
document.getElementById('b-voice').addEventListener('click', (e) => {
  S.voiceOn = !S.voiceOn;
  e.currentTarget.classList.toggle('on', S.voiceOn);
  e.currentTarget.textContent = S.voiceOn ? '♪ VOICE ON' : '♪ VOICE OFF';
  if (!S.voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel();
});

// ---------- boot ----------
setTimeout(() => {
  setMood('calm');
  say(visits > 1 ? pick(LINES.back) : pick(LINES.wake), true);
}, 900);

let lastT = performance.now();
function loop(nowMs){
  requestAnimationFrame(loop);
  const now = nowMs;
  const dt = Math.min(.05, (now - lastT)/1000); lastT = now;
  analyze(now);
  think(dt, now);
  draw(now, dt);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
